    html, body {

    .selector-topbar {
      height: 68px;

      z-index: 20;

      align-items: center;
      gap: 18px;

    .selector-topbar-titles {

      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .selector-topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-where-to-buy-top {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--lopal-green);
      color: #FFFFFF !important;
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(0, 132, 61, 0.28);
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-where-to-buy-top:hover {
      background: var(--lopal-green-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(0, 132, 61, 0.36);
    }
    .selector-frame-wrap {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
      height: calc(100% - 68px);
      height: calc(100dvh - 68px);
      background: #FFFFFF;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .selector-full-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Плавающая кнопка "Қайдан сатып алуға болады" поверх правого нижнего угла каталога подбора */
    .floating-dealers-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0F172A;
      color: #FFFFFF !important;
      border: 2px solid var(--lopal-green);
      padding: 14px 24px;
      border-radius: 9999px;
      font-size: 14.5px;
      font-weight: 800;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.32);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .floating-dealers-btn:hover {
      background: var(--lopal-green);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 132, 61, 0.4);
    }
    .floating-dealers-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ADE80;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.25);
    }
